{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4"><i class="bi bi-gear"></i> Admin Panel</h2>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card text-center p-3">
                <h3>{{ stats.users }}</h3>
                <p class="mb-0 text-muted">Total Users</p>
                <small class="text-success">{{ stats.active_users }} active</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center p-3">
                <h3>{{ stats.organizations }}</h3>
                <p class="mb-0 text-muted">Organizations</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center p-3">
                <h3>{{ stats.roles }}</h3>
                <p class="mb-0 text-muted">Roles</p>
            </div>
        </div>
    </div>

    <div class="list-group">
        <a href="{{ url_for('admin.users') }}" class="list-group-item list-group-item-action">
            <i class="bi bi-people"></i> Manage Users
        </a>
        <a href="{{ url_for('admin.organizations') }}" class="list-group-item list-group-item-action">
            <i class="bi bi-building"></i> Manage Organizations
        </a>
        <a href="{{ url_for('admin.roles') }}" class="list-group-item list-group-item-action">
            <i class="bi bi-person-badge"></i> Manage Roles
        </a>
        <a href="{{ url_for('admin.settings') }}" class="list-group-item list-group-item-action">
            <i class="bi bi-sliders"></i> System Settings
        </a>
    </div>
</div>
{% endblock %}
