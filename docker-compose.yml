services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracepass
      POSTGRES_PASSWORD: tracepass_secret
      POSTGRES_DB: tracepass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracepass -d tracepass"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      FLASK_CONFIG: production
      SECRET_KEY: change-this-in-real-production-use-long-random-string
      DATABASE_URL: postgresql+psycopg2://tracepass:tracepass_secret@db:5432/tracepass
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
